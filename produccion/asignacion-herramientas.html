<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SAFCO · Asignación de Herramientas Producción</title>
    <!-- Fonts & Icons -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&family=DM+Mono:wght@400;500;700&display=swap" rel="stylesheet">
    <link href="https://unpkg.com/boxicons@2.1.4/css/boxicons.min.css" rel="stylesheet">
    
    <!-- Base Styles & Produccion Styles -->
    <link rel="stylesheet" href="../css/styles.css">
    <link rel="stylesheet" href="css/produccion.css">
    
    <!-- SweetAlert2 -->
    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
</head>
<body style="background-color: var(--safco-bg); min-height: 100vh;">
    <main class="content-area" style="padding: 1.5rem; max-width: 1300px; margin: 0 auto;">
        
        <!-- Banner de Cabecera Ejecutiva -->
        <div class="produccion-banner">
            <div class="produccion-banner-title">
                <div class="produccion-banner-icon">
                    <i class='bx bx-wrench'></i>
                </div>
                <div>
                    <h1>Asignación de Herramientas Producción</h1>
                    <p>Entrega Múltiple y Trazabilidad por Operario y Mesa de Trabajo</p>
                </div>
            </div>
            <div style="display: flex; gap: 0.5rem; flex-wrap: wrap; align-items: center;">
                <button class="btn-kiosk-toggle" id="btn-kiosk-mode" onclick="toggleTabletKioskMode()" title="Ocultar Menú/Header y ocupar todo el espacio web">
                    <i class='bx bx-fullscreen'></i> <span class="txt-kiosk">Modo Tablet</span>
                </button>
                <button class="btn-safco btn-safco-primary" onclick="abrirModalEntregaMultiple()">
                    <i class='bx bx-plus-circle'></i> Entregar Herramientas Múltiples
                </button>
            </div>
        </div>

        <!-- Panel Colapsable de Filtros y KPIs -->
        <div class="collapsible-filter-card expanded" id="panel-filtros-herr">
            <div class="collapsible-filter-header" onclick="togglePanelFiltros('panel-filtros-herr')">
                <div class="filter-header-title">
                    <i class='bx bx-filter-alt'></i> Filtros de Herramientas y Resumen de Estado
                </div>
                <button class="btn-toggle-panel" type="button">
                    <span class="txt-toggle">Ocultar Filtros</span>
                    <i class='bx bx-chevron-up ico-toggle'></i>
                </button>
            </div>
            <div class="collapsible-filter-body">
                <!-- Barra de Filtros -->
                <div class="filter-bar-produccion" style="margin-bottom: 1rem;">
                    <div class="filter-item" style="max-width: 180px;">
                        <label for="filter-linea">Línea de Producción:</label>
                        <select id="filter-linea" class="select-touch" onchange="renderHerramientas()">
                            <option value="TODAS">Todas las Líneas</option>
                            <option value="Línea 1">Línea 1</option>
                            <option value="Línea 2">Línea 2</option>
                            <option value="Línea 3">Línea 3</option>
                        </select>
                    </div>

                    <div class="filter-item" style="max-width: 180px;">
                        <label for="filter-tipo-herr">Tipo de Herramienta:</label>
                        <select id="filter-tipo-herr" class="select-touch" onchange="renderHerramientas()">
                            <option value="TODOS">Todos los Tipos</option>
                            <option value="Tijera">✂️ Tijeras</option>
                            <option value="Pesa Patrón">⚖️ Pesas Patrón</option>
                            <option value="Calibrador">📐 Calibradores</option>
                        </select>
                    </div>

                    <div class="filter-item" style="flex: 2; min-width: 220px;">
                        <label for="input-search-herr">Buscar por Operario, Mesa o Herramienta:</label>
                        <input type="text" id="input-search-herr" class="input-touch" placeholder="Ej: Ana García, L1-R1-M03, Tijera 02..." oninput="renderHerramientas()">
                    </div>
                </div>

                <!-- Tarjetas KPI Resumen -->
                <div class="kpi-grid" style="margin-bottom: 0;">
                    <div class="kpi-card clickable active-kpi" id="kpi-card-herr-todas" onclick="filtrarPorKPI('TODAS')">
                        <div class="kpi-val" id="kpi-operarios-con-herr">0</div>
                        <div class="kpi-lbl">Operarios Equipados</div>
                    </div>
                    <div class="kpi-card clickable" id="kpi-card-herr-disp" onclick="filtrarPorKPI('DISPONIBLES')">
                        <div class="kpi-val ok" id="kpi-herr-disp">0</div>
                        <div class="kpi-lbl">Disponibles Almacén</div>
                    </div>
                    <div class="kpi-card clickable" id="kpi-card-herr-uso" onclick="filtrarPorKPI('EN_USO')">
                        <div class="kpi-val warn" id="kpi-herr-uso">0</div>
                        <div class="kpi-lbl">En Uso en Mesa</div>
                    </div>
                    <div class="kpi-card clickable" id="kpi-card-herr-venc" onclick="filtrarPorKPI('VENCIDAS')">
                        <div class="kpi-val bad" id="kpi-herr-venc">0</div>
                        <div class="kpi-lbl">Calibración Vencida</div>
                    </div>
                </div>
            </div>
        </div>

        <!-- Vista Principal: Tarjetas de Operarios con sus Herramientas y Mesas -->
        <div id="contenedor-operarios-herramientas">
            <!-- Renderizado dinámico -->
        </div>

    </main>

    <!-- Modal Touch: Entrega Múltiple de Herramientas -->
    <div class="modal-backdrop-safco" id="modal-entrega-multiple">
        <div class="modal-card-safco">
            <div class="modal-card-header">
                <h3><i class='bx bx-plus-circle'></i> Entregar Herramientas Múltiples</h3>
                <button class="btn-close-safco" onclick="cerrarModal('modal-entrega-multiple')">&times;</button>
            </div>
            <div class="modal-card-body">
                
                <div class="form-group-safco">
                    <label for="select-op-entrega-mult">Seleccionar Operario:</label>
                    <select id="select-op-entrega-mult" class="select-touch" style="width: 100%;">
                        <!-- Opciones cargadas dinámicamente -->
                    </select>
                </div>

                <div class="form-group-safco">
                    <label>Seleccionar Herramientas a Entregar (Selección Múltiple):</label>
                    <div id="lista-herramientas-disponibles-checkboxes" style="max-height: 200px; overflow-y: auto; border: 1.5px solid var(--safco-border); border-radius: 8px; padding: 0.75rem; background: #ffffff;">
                        <!-- Checkboxes de herramientas -->
                    </div>
                </div>

                <div class="modal-card-actions">
                    <button class="btn-safco btn-safco-secondary" style="flex: 1;" onclick="cerrarModal('modal-entrega-multiple')">Cancelar</button>
                    <button class="btn-safco btn-safco-teal" style="flex: 1;" onclick="confirmarEntregaMultiple()">
                        <i class='bx bx-check-double'></i> Entregar Seleccionadas
                    </button>
                </div>

            </div>
        </div>
    </div>

    <!-- Modal Touch: Devolución Individual por Persona -->
    <div class="modal-backdrop-safco" id="modal-devolucion-persona">
        <div class="modal-card-safco">
            <div class="modal-card-header" style="background-color: var(--safco-teal-dark);">
                <h3 id="titulo-devolucion-persona"><i class='bx bx-refresh'></i> Devolver Herramientas de Operario</h3>
                <button class="btn-close-safco" onclick="cerrarModal('modal-devolucion-persona')">&times;</button>
            </div>
            <div class="modal-card-body">
                <input type="hidden" id="dev-op-id-hidden">

                <div class="form-group-safco">
                    <label for="select-herr-dev-persona">Herramienta a Devolver:</label>
                    <select id="select-herr-dev-persona" class="select-touch" style="width: 100%;">
                        <!-- Cargar herramientas que tiene la persona -->
                    </select>
                </div>

                <div class="form-group-safco">
                    <label for="select-estado-dev-persona">Estado al Retornar:</label>
                    <select id="select-estado-dev-persona" class="select-touch" style="width: 100%;">
                        <option value="✅ Bueno (Disponible)">✅ Excelente / Listo para Reuso</option>
                        <option value="⚪ Deteriorada (No usable)">⚪ Deteriorada (Requiere reparación)</option>
                        <option value="🔴 Perdida">🔴 Reportada Perdida</option>
                    </select>
                </div>

                <div class="modal-card-actions">
                    <button class="btn-safco btn-safco-secondary" style="flex: 1;" onclick="cerrarModal('modal-devolucion-persona')">Cancelar</button>
                    <button class="btn-safco btn-safco-primary" style="flex: 1;" onclick="confirmarDevolucionPersona()">
                        <i class='bx bx-archive-in'></i> Registrar Devolución
                    </button>
                </div>

            </div>
        </div>
    </div>

    <!-- Scripts de Lógica y Datos -->
    <script src="js/produccion-data.js"></script>
    <script>
        let filtroKPIActual = 'TODAS';

        document.addEventListener('DOMContentLoaded', () => {
            renderHerramientas();
        });

        // Toggle Modo Tablet Kiosco CSS puro (Apto para Capacitor y Web)
        function toggleTabletKioskMode() {
            let isKiosk = document.body.classList.toggle('standalone-kiosk-mode');

            try {
                if (window.parent && window.parent !== window) {
                    window.parent.postMessage({ type: 'TOGGLE_TABLET_KIOSK' }, '*');
                }
            } catch (e) {
                console.warn('Cross-origin frame notice:', e);
            }

            actualizarBotonKioskUI(isKiosk);
        }

        function actualizarBotonKioskUI(isKiosk) {
            const btn = document.getElementById('btn-kiosk-mode');
            if (btn) {
                if (isKiosk) {
                    btn.classList.add('active-kiosk');
                    btn.innerHTML = `<i class='bx bx-exit-fullscreen'></i> <span class="txt-kiosk">Restaurar Navegación</span>`;
                } else {
                    btn.classList.remove('active-kiosk');
                    btn.innerHTML = `<i class='bx bx-fullscreen'></i> <span class="txt-kiosk">Modo Tablet</span>`;
                }
            }
        }

        window.addEventListener('message', (event) => {
            if (event.data && event.data.type === 'TABLET_KIOSK_STATUS') {
                const isKiosk = event.data.isKiosk;
                actualizarBotonKioskUI(isKiosk);
                if (isKiosk) document.body.classList.add('standalone-kiosk-mode');
                else document.body.classList.remove('standalone-kiosk-mode');
            }
        });

        function togglePanelFiltros(panelId) {
            const panel = document.getElementById(panelId);
            const isExpanded = panel.classList.contains('expanded');
            const txtToggle = panel.querySelector('.txt-toggle');
            const icoToggle = panel.querySelector('.ico-toggle');

            if (isExpanded) {
                panel.classList.remove('expanded');
                if (txtToggle) txtToggle.textContent = 'Mostrar Filtros';
                if (icoToggle) {
                    icoToggle.classList.remove('bx-chevron-up');
                    icoToggle.classList.add('bx-chevron-down');
                }
            } else {
                panel.classList.add('expanded');
                if (txtToggle) txtToggle.textContent = 'Ocultar Filtros';
                if (icoToggle) {
                    icoToggle.classList.remove('bx-chevron-down');
                    icoToggle.classList.add('bx-chevron-up');
                }
            }
        }

        function filtrarPorKPI(tipoKPI) {
            filtroKPIActual = tipoKPI;
            document.querySelectorAll('.kpi-card').forEach(c => c.classList.remove('active-kpi'));
            if (tipoKPI === 'TODAS') document.getElementById('kpi-card-herr-todas').classList.add('active-kpi');
            if (tipoKPI === 'DISPONIBLES') document.getElementById('kpi-card-herr-disp').classList.add('active-kpi');
            if (tipoKPI === 'EN_USO') document.getElementById('kpi-card-herr-uso').classList.add('active-kpi');
            if (tipoKPI === 'VENCIDAS') document.getElementById('kpi-card-herr-venc').classList.add('active-kpi');
            renderHerramientas();
        }

        function renderHerramientas() {
            const fLinea = document.getElementById('filter-linea').value;
            const fTipo = document.getElementById('filter-tipo-herr').value;
            const search = document.getElementById('input-search-herr').value.toLowerCase().trim();

            const herrs = ProduccionDB.getHerramientas();
            const asignacionesMesas = ProduccionDB.getAsignacionesMesas();
            const asignacionesHerr = ProduccionDB.getAsignacionesHerramientas();
            const operarios = ProduccionDB.getOperarios();
            const mesas = ProduccionDB.getMesas();

            const opToMesaMap = {};
            Object.keys(asignacionesMesas).forEach(codigoMesa => {
                const mesaObj = mesas.find(m => m.codigo === codigoMesa);
                const integrs = asignacionesMesas[codigoMesa] || [];
                integrs.forEach(x => {
                    const opId = typeof x === 'string' ? x : x.opId;
                    const labor = typeof x === 'string' ? 'Operario' : x.labor;
                    if (opId) {
                        opToMesaMap[opId] = {
                            codigo: codigoMesa,
                            linea: mesaObj ? mesaObj.linea : 'Línea 1',
                            riel: mesaObj ? mesaObj.riel : 'Riel 1',
                            labor: labor || 'Operario'
                        };
                    }
                });
            });

            const herrByOpMap = {};
            asignacionesHerr.forEach(asig => {
                if (!herrByOpMap[asig.operarioId]) {
                    herrByOpMap[asig.operarioId] = [];
                }
                herrByOpMap[asig.operarioId].push(asig);
            });

            const totalDisp = herrs.filter(h => h.estado === 'Disponible').length;
            const totalUso = herrs.filter(h => h.estado === 'Asignado').length;
            const totalVenc = herrs.filter(h => h.estado === 'Deteriorada' || h.estado === 'Perdida').length;
            const totalOpsEquipados = Object.keys(herrByOpMap).length;

            document.getElementById('kpi-herr-disp').textContent = totalDisp;
            document.getElementById('kpi-herr-uso').textContent = totalUso;
            document.getElementById('kpi-herr-venc').textContent = totalVenc;
            document.getElementById('kpi-operarios-con-herr').textContent = totalOpsEquipados;

            const contenedor = document.getElementById('contenedor-operarios-herramientas');
            contenedor.innerHTML = '';

            const operariosAMostrar = operarios.filter(op => opToMesaMap[op.id] || (herrByOpMap[op.id] && herrByOpMap[op.id].length > 0));

            if (operariosAMostrar.length === 0) {
                contenedor.innerHTML = `<div style="text-align: center; padding: 2rem; color: var(--safco-text-muted);">No hay entregas registradas ni operarios en mesa. Usa el botón "Entregar Herramientas Múltiples".</div>`;
                return;
            }

            operariosAMostrar.forEach(op => {
                const infoMesa = opToMesaMap[op.id] || { codigo: 'Sin Mesa', linea: 'Línea 1', riel: 'Riel 1', labor: op.cargo };
                const herrsAsignadas = herrByOpMap[op.id] || [];

                if (fLinea !== 'TODAS' && infoMesa.linea !== fLinea) return;

                let herrsFiltradas = herrsAsignadas;
                if (fTipo !== 'TODOS') {
                    herrsFiltradas = herrsAsignadas.filter(h => h.tipo === fTipo);
                    if (herrsFiltradas.length === 0 && search === '') return;
                }

                if (filtroKPIActual === 'EN_USO' && herrsAsignadas.length === 0) return;
                if (filtroKPIActual === 'VENCIDAS') {
                    const tieneVenc = herrsAsignadas.some(h => {
                        const ho = herrs.find(x => x.codigo === h.herramientaCodigo);
                        return ho && (ho.estado === 'Deteriorada' || ho.estado === 'Perdida');
                    });
                    if (!tieneVenc) return;
                }

                if (search) {
                    const matchOp = op.nombre.toLowerCase().includes(search);
                    const matchMesa = infoMesa.codigo.toLowerCase().includes(search);
                    const matchHerr = herrsAsignadas.some(h => h.herramientaCodigo.toLowerCase().includes(search));
                    if (!matchOp && !matchMesa && !matchHerr) return;
                }

                const iniciales = op.nombre.split(' ').map(n => n[0]).join('').substring(0, 2);
                const isSeleccionador = infoMesa.labor === 'Seleccionador';

                let herrsChipsHtml = '';
                if (herrsAsignadas.length === 0) {
                    herrsChipsHtml = `<span style="font-size: 0.8rem; color: var(--safco-red); font-style: italic;"><i class='bx bx-error-circle'></i> Sin herramientas asignadas</span>`;
                } else {
                    herrsAsignadas.forEach(h => {
                        const icon = h.tipo === 'Tijera' ? '✂️' : (h.tipo === 'Calibrador' ? '📐' : '⚖️');
                        const hObj = herrs.find(x => x.codigo === h.herramientaCodigo);
                        const isVencida = hObj && (hObj.estado === 'Deteriorada' || hObj.estado === 'Perdida');
                        const calibTxt = isVencida ? `⚠️ ${hObj.estado}` : `Calib: ${hObj ? hObj.diasCalibracion : 15} días`;

                        herrsChipsHtml += `
                            <div class="herr-chip ${isVencida ? 'warn' : ''}">
                                <span class="herr-chip-icon">${icon}</span>
                                <div>
                                    <div class="herr-chip-name">${h.herramientaCodigo}</div>
                                    <div class="herr-chip-calib">${calibTxt} · ${h.fechaEntrega}</div>
                                </div>
                            </div>
                        `;
                    });
                }

                contenedor.innerHTML += `
                    <div class="operario-herr-card ${herrsAsignadas.length === 0 ? 'incompleto-herr' : ''}">
                        <div class="operario-card-header">
                            <div class="op-main-det">
                                <div class="op-big-avatar">${iniciales}</div>
                                <div>
                                    <div class="op-title-name">${op.nombre} <span class="badge-rol ${isSeleccionador ? 'b-sel' : 'b-emb'}">${infoMesa.labor}</span></div>
                                    <div class="op-mesa-tag"><i class='bx bx-table'></i> ${infoMesa.codigo} (${infoMesa.linea} - ${infoMesa.riel})</div>
                                </div>
                            </div>
                            <div style="display: flex; gap: 0.4rem;">
                                <button class="btn-safco btn-safco-teal" style="height: 36px; padding: 0 0.8rem; font-size: 0.8rem;" onclick="abrirModalEntregaParaOp('${op.id}')">
                                    <i class='bx bx-plus'></i> Entregar
                                </button>
                                <button class="btn-safco btn-safco-secondary" style="height: 36px; padding: 0 0.8rem; font-size: 0.8rem;" onclick="abrirModalDevolucionPersona('${op.id}')">
                                    <i class='bx bx-refresh'></i> Devolver
                                </button>
                            </div>
                        </div>
                        <div>
                            <div style="font-size: 0.72rem; font-weight: 700; text-transform: uppercase; color: var(--safco-text-muted); margin-bottom: 0.35rem;">
                                Herramientas a su cargo (${herrsAsignadas.length}):
                            </div>
                            <div class="herr-chips-grid">
                                ${herrsChipsHtml}
                            </div>
                        </div>
                    </div>
                `;
            });
        }

        function abrirModalEntregaMultiple() {
            poblarSelectOperariosEntrega();
            poblarCheckboxesHerramientasDisponibles();
            document.getElementById('modal-entrega-multiple').classList.add('active');
        }

        function abrirModalEntregaParaOp(opId) {
            poblarSelectOperariosEntrega();
            document.getElementById('select-op-entrega-mult').value = opId;
            poblarCheckboxesHerramientasDisponibles();
            document.getElementById('modal-entrega-multiple').classList.add('active');
        }

        function poblarSelectOperariosEntrega() {
            const operarios = ProduccionDB.getOperarios();
            const asignacionesMesas = ProduccionDB.getAsignacionesMesas();
            const select = document.getElementById('select-op-entrega-mult');
            select.innerHTML = '';

            const opMesaMap = {};
            Object.keys(asignacionesMesas).forEach(codigoMesa => {
                const integrs = asignacionesMesas[codigoMesa] || [];
                integrs.forEach(x => {
                    const opId = typeof x === 'string' ? x : x.opId;
                    if (opId) opMesaMap[opId] = codigoMesa;
                });
            });

            operarios.forEach(op => {
                const mesa = opMesaMap[op.id];
                const mesaTxt = mesa ? ` · Mesa ${mesa}` : '';
                select.innerHTML += `<option value="${op.id}">${op.nombre} (${op.cargo}${mesaTxt})</option>`;
            });
        }

        function poblarCheckboxesHerramientasDisponibles() {
            const herrs = ProduccionDB.getHerramientas();
            const disp = herrs.filter(h => h.estado === 'Disponible');
            const cont = document.getElementById('lista-herramientas-disponibles-checkboxes');
            cont.innerHTML = '';

            if (disp.length === 0) {
                cont.innerHTML = `<div style="color: var(--safco-red); font-size: 0.85rem; text-align: center; padding: 1rem;">No hay herramientas disponibles en almacén.</div>`;
                return;
            }

            disp.forEach(h => {
                const icon = h.tipo === 'Tijera' ? '✂️' : (h.tipo === 'Calibrador' ? '📐' : '⚖️');
                cont.innerHTML += `
                    <label style="display: flex; align-items: center; gap: 0.6rem; padding: 0.4rem 0; border-bottom: 1px solid var(--safco-border); font-size: 0.85rem; cursor: pointer;">
                        <input type="checkbox" name="chk-herr-disp" value="${h.codigo}" style="width: 18px; height: 18px; accent-color: var(--safco-teal);">
                        <span>${icon} <strong>${h.codigo}</strong> (${h.tipo})</span>
                    </label>
                `;
            });
        }

        function confirmarEntregaMultiple() {
            const opId = document.getElementById('select-op-entrega-mult').value;
            const checkboxes = document.querySelectorAll('input[name="chk-herr-disp"]:checked');
            const seleccionadas = Array.from(checkboxes).map(cb => cb.value);

            if (!opId) {
                Swal.fire('Atención', 'Selecciona a un operario.', 'warning');
                return;
            }

            if (seleccionadas.length === 0) {
                Swal.fire('Atención', 'Selecciona al menos una herramienta para entregar.', 'warning');
                return;
            }

            ProduccionDB.entregarHerramientasMultiples(opId, seleccionadas);
            cerrarModal('modal-entrega-multiple');
            renderHerramientas();

            Swal.fire({
                toast: true,
                position: 'top-end',
                icon: 'success',
                title: `${seleccionadas.length} Herramientas entregadas con éxito`,
                showConfirmButton: false,
                timer: 2000
            });
        }

        function abrirModalDevolucionPersona(opId) {
            document.getElementById('dev-op-id-hidden').value = opId;
            const operarios = ProduccionDB.getOperarios();
            const opObj = operarios.find(o => o.id === opId);

            document.getElementById('titulo-devolucion-persona').innerHTML = `<i class='bx bx-refresh'></i> Devolver Herramientas - ${opObj ? opObj.nombre : ''}`;

            const asignacionesHerr = ProduccionDB.getAsignacionesHerramientas();
            const herrsPersona = asignacionesHerr.filter(a => a.operarioId === opId);

            const select = document.getElementById('select-herr-dev-persona');
            select.innerHTML = '';

            if (herrsPersona.length === 0) {
                select.innerHTML = `<option value="">-- Esta persona no tiene herramientas asignadas --</option>`;
            } else {
                herrsPersona.forEach(h => {
                    select.innerHTML += `<option value="${h.herramientaCodigo}">${h.herramientaCodigo} (${h.tipo})</option>`;
                });
            }

            document.getElementById('modal-devolucion-persona').classList.add('active');
        }

        function confirmarDevolucionPersona() {
            const opId = document.getElementById('dev-op-id-hidden').value;
            const herrCodigo = document.getElementById('select-herr-dev-persona').value;
            const estadoDev = document.getElementById('select-estado-dev-persona').value;

            if (!herrCodigo) {
                Swal.fire('Atención', 'No hay herramientas a devolver.', 'warning');
                return;
            }

            ProduccionDB.devolverHerramientaPorOperario(opId, herrCodigo, estadoDev);
            cerrarModal('modal-devolucion-persona');
            renderHerramientas();

            Swal.fire({
                toast: true,
                position: 'top-end',
                icon: 'success',
                title: `${herrCodigo} devuelta a almacén`,
                showConfirmButton: false,
                timer: 2000
            });
        }

        function cerrarModal(id) {
            document.getElementById(id).classList.remove('active');
        }
    </script>
</body>
</html>
